name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build release exe
        shell: bash
        run: |
          touch src-tauri/src/main.rs
          cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Create Release & upload exe
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/ProxyEnv.exe
          name: Windows Proxy Env ${{ github.ref_name }}
          body_path: changelog.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
